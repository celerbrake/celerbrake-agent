name: celerbrake-agent

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # One red entry must not cancel the others, or the matrix reports a single
      # failure plus N cancellations and the real state is unknowable.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The gemspec floor is Ruby 3.0, but the fleet runs 3.4 and the agent is
        # only ever installed on Nanza-managed hosts. 3.3 and 3.4 are the two
        # versions that actually carry the gem, so those are the ones tested.
        ruby: ['3.3', '3.4']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Display Ruby version
        run: ruby -v

      - name: Test
        run: bundle exec rake
